name: Publicar simple-web-page como artefato

on:
  push:
    branches: [main]
    paths:
      - 'projetos/simple-web-page/web/**'
      - 'projetos/simple-web-page/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projetos/simple-web-page/web
